<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Демо-проект - Мария Коренева</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:Manrope,sans-serif;background:#080b10;color:#f5f1ec;overflow:hidden}
    .viewer{display:flex;flex-direction:column;height:100%;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .toolbar{flex:0 0 auto;display:flex;align-items:center;min-height:52px;padding:10px 12px;border-bottom:1px solid rgba(225,170,145,.35);background:#0d1118}
    .back{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;color:#f5f1ec;text-decoration:none;font-size:14px;font-weight:700;line-height:1.3}
    .back:hover{color:#E1AA91}
    .frame-wrap{flex:1 1 auto;min-height:0;position:relative;background:#05070a}
    .frame-wrap iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;color:#aeb4bf;font-size:15px;line-height:1.6}
    .fallback.visible{display:flex;flex-direction:column;gap:16px}
    @media(max-width:430px){
      .toolbar{padding:8px 10px}
      .back{font-size:13px}
    }
  </style>
</head>
<body>
  <div class="viewer">
    <header class="toolbar">
      <a class="back" id="back-link" href="index.html#projects">← Вернуться к примерам решений</a>
    </header>
    <div class="frame-wrap">
      <iframe id="demo-frame" title="Демо-проект" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
      <div class="fallback" id="fallback">
        <p id="fallback-text">Не удалось загрузить демо в окне просмотра.</p>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const copy = {
        ru: {
          title: 'Демо-проект - Мария Коренева',
          back: '← Вернуться к примерам решений',
          frameTitle: 'Демо-проект',
          fallback: 'Не удалось загрузить демо в окне просмотра.'
        },
        en: {
          title: 'Demo project - Maria Koreneva',
          back: '← Back to Solutions',
          frameTitle: 'Demo project',
          fallback: 'The demo could not be loaded in the viewer.'
        }
      };

      const params = new URLSearchParams(location.search);
      const demoUrl = params.get('url');
      const back = params.get('back');
      const lang = params.get('lang') === 'en' ? 'en' : 'ru';
      const t = copy[lang];

      function isAllowedDemoUrl(url) {
        try {
          const parsed = new URL(url);
          return parsed.protocol === 'https:' && parsed.hostname === 'mariakoreneva.github.io';
        } catch {
          return false;
        }
      }

      function isSafeBackPath(path) {
        if (!path || path.includes('://') || path.startsWith('//')) return false;
        return /^(websites|online-tools|bots)\.html(\?lang=en)?$/.test(path);
      }

      const backLink = document.getElementById('back-link');
      const frame = document.getElementById('demo-frame');
      const fallback = document.getElementById('fallback');
      const fallbackText = document.getElementById('fallback-text');

      document.documentElement.lang = lang;
      document.title = t.title;
      backLink.textContent = t.back;
      frame.title = t.frameTitle;
      fallbackText.textContent = t.fallback;

      if (!isAllowedDemoUrl(demoUrl) || !isSafeBackPath(back)) {
        backLink.href = lang === 'en' ? 'index.html?lang=en#projects' : 'index.html#projects';
        frame.hidden = true;
        fallback.classList.add('visible');
        return;
      }

      backLink.href = back;
      frame.src = demoUrl;

      let loaded = false;
      frame.addEventListener('load', () => {
        loaded = true;
      });

      window.setTimeout(() => {
        if (loaded) return;
        fallback.classList.add('visible');
      }, 12000);
    })();
  </script>
</body>
</html>
